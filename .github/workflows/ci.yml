name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests GdUnit4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version à confirmer au premier lancement : l'action attend la chaîne publiée par godotengine/godot-builds.
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Import du projet
        run: godot --headless --path . --import
      - name: Contrôle du typage
        run: GODOT_BIN="$(which godot)" bash tools/check_typing.sh
      - name: Suites GdUnit4
        run: GODOT_BIN="$(which godot)" bash addons/gdUnit4/runtest.sh --headless -a res://tests --ignoreHeadlessMode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-gdunit4
          path: reports/
          if-no-files-found: ignore

  lint:
    name: gdformat et gdlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash tools/setup_gdtoolkit.sh
      - run: bash tools/lint.sh

  hooks:
    name: Tests des hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -B -m unittest discover -s .claude/hooks -p 'test_*.py'

  # Décisions 0005 et 0043 : export Web sans threads à chaque CI, déploiement sur GitHub Pages
  # seulement depuis main.
  export-web:
    name: Export Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import du projet
        run: godot --headless --path . --import
      - name: Export Web (preset « Web » de export_presets.cfg)
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.pck
      - name: Autoload d'outillage absent du pack (décision 0011)
        run: |
          if grep -a -c "_mcp_game_helper" build/web/index.pck; then
            echo "L'autoload _mcp_game_helper est dans le pack" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Déploiement GitHub Pages
    needs: [tests, lint, hooks, export-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
