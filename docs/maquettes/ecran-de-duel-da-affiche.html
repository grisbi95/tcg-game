<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction B : Affiche</title>
<!-- Maquette de direction artistique de l'écran de duel (étape 2b.4), version 1 du 2026-10-25.
     Géométrie du gabarit validé (décision 0053, docs/maquettes/ecran-de-duel-gabarit.html) ;
     style selon docs/direction-artistique/bible.md. Illustrations factices : formes à remplacer par l'IA. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Literata:opsz,wght@7..72,400..700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d0c0b; color: #e8e2d6;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  header h1 { font-size: 18px; margin: 0 12px 0 0; }
  header label { display: inline-flex; gap: 6px; align-items: center; color: #a39a8b; }
  #frame { margin: 0 16px 16px; position: relative; }
  #screen { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform-origin: 0 0; overflow: hidden; outline: 1px solid #000; }
  #screen div { position: absolute; }
  .t { white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; }
  #charte { margin: 0 16px 32px; display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .doc { background: #1a1816; border: 1px solid #2f2a24; padding: 12px 14px; }
  .doc h2 { font-size: 15px; margin: 0 0 8px; }
  .doc p, .doc li { margin: 0 0 4px; color: #b5ab9a; }
  .doc ul { margin: 0; padding-left: 18px; }
  .sw { display: inline-flex; align-items: center; gap: 6px; margin: 0 10px 6px 0; font-size: 12px;
    color: #b5ab9a; }
  .sw i { display: inline-block; width: 18px; height: 18px; border: 1px solid #000; }
</style>
</head>
<body>
<header>
  <h1>Écran de duel · Direction B : Affiche</h1>
  <label>Échelle
    <select id="scale">
      <option value="fit">ajustée à la fenêtre</option>
      <option value="1">1920×1080 (100 %)</option>
      <option value="0.6667">1280×720 (2/3)</option>
    </select>
  </label>
  <label><input type="checkbox" id="prev" checked> Aperçu au survol</label>
</header>

<div id="frame"><div id="screen"></div></div>

<section id="charte"></section>

<script>
const T = {
  "fontTitle": "'Bricolage Grotesque', sans-serif",
  "fontText": "'Literata', serif",
  "table": "radial-gradient(rgba(21,18,15,.09) 22%, transparent 24%) 0 0 / 9px 9px, #ece1c8",
  "swTable": "#ece1c8",
  "light": "radial-gradient(ellipse 60% 70% at 50% 0%, rgba(255,255,255,.35), transparent 70%)",
  "arena": "radial-gradient(closest-side, #f6eedb, #ece1c8 80%, transparent)",
  "ink": "#15120f",
  "paper": "#fbf5e6",
  "paperDark": "#d9ccad",
  "muted": "#7a7060",
  "panel": "#fbf5e6",
  "textOnPanel": "#15120f",
  "coord": "#5c554b",
  "hole": "#ddd0b0",
  "holeShadow": "#b9aa86",
  "grout": "#15120f",
  "cell": "#fbf5e6",
  "cellAlt": "#f3ead3",
  "cellEdge": "#d9ccad",
  "track": "#d9ccad",
  "a": "#1f5fd1",
  "b": "#d8322a",
  "essence": "#f6c21c",
  "yellow": "#f6c21c",
  "green": "#2fa84f",
  "forceUp": "#2d7a2f",
  "forceDown": "#b0560f",
  "heart": "#d8322a",
  "heroHue": "#e48ea0",
  "type": {
    "unit": "#9cc06e",
    "building": "#e3ad4f",
    "spell": "#8d9fe0",
    "gear": "#e08a5f",
    "hero": "#e48ea0"
  },
  "tintShade": "#00000022",
  "band": "flat",
  "artDot": "rgba(21,18,15,.22)",
  "backFill": "#15120f",
  "backLine": "rgba(251,245,230,.16)",
  "decoInk": "#d9ccad",
  "decoOpacity": 0.8,
  "cut": 10,
  "line": 3,
  "shadow": 10,
  "charte": "<div class=\"doc\"><h2>Intention</h2><p>« Affiche » : une page de bande dessinée imprimée. Table en papier clair tramé, tout cerné d'un trait épais, ombres d'encre très décalées, aplats francs sans hachures. Le cérémonial d'une affiche de tournoi.</p></div><div class=\"doc\"><h2>Palette</h2><span class=\"sw\"><i style=\"background:#ece1c8\"></i>table #ece1c8</span><span class=\"sw\"><i style=\"background:#fbf5e6\"></i>papier #fbf5e6</span><span class=\"sw\"><i style=\"background:#15120f\"></i>encre #15120f</span><span class=\"sw\"><i style=\"background:#1f5fd1\"></i>A #1f5fd1</span><span class=\"sw\"><i style=\"background:#d8322a\"></i>B #d8322a</span><span class=\"sw\"><i style=\"background:#f6c21c\"></i>Essence #f6c21c</span><span class=\"sw\"><i style=\"background:#f6c21c\"></i>surligné #f6c21c</span><span class=\"sw\"><i style=\"background:#2fa84f\"></i>choisi #2fa84f</span><p style=\"margin-top:6px\">Teintes de type :</p><span class=\"sw\"><i style=\"background:#9cc06e\"></i>unit #9cc06e</span><span class=\"sw\"><i style=\"background:#e3ad4f\"></i>building #e3ad4f</span><span class=\"sw\"><i style=\"background:#8d9fe0\"></i>spell #8d9fe0</span><span class=\"sw\"><i style=\"background:#e08a5f\"></i>gear #e08a5f</span><span class=\"sw\"><i style=\"background:#e48ea0\"></i>hero #e48ea0</span></div><div class=\"doc\"><h2>Polices (OFL)</h2><p><b style=\"font-family:'Bricolage Grotesque';font-weight:800\">Bricolage Grotesque</b> : titres, chiffres, bandeaux.</p><p><span style=\"font-family:Literata\">Literata</span> : textes de règles et bulles.</p></div><div class=\"doc\"><h2>Ce qu'elle apporte</h2><ul><li>Très singulier : se reconnaît d'un coup d'œil, se démarque des jeux sombres.</li><li>Lisible en plein jour et sur un écran de portable.</li><li>Les illustrations détourées s'y posent naturellement.</li></ul></div><div class=\"doc\"><h2>Ce qu'elle coûte</h2><ul><li>Fatigue l'œil sur un long duel ou dans une pièce sombre ; contredit la bible (« fond sombre »).</li><li>Le surligné jaune ressort moins sur le papier ; il faut le cerner d'encre.</li><li>Plus loin du gabarit : l'habillage demandera plus d'ajustements.</li></ul></div>"
};

const screen = document.getElementById("screen");
screen.style.background = T.table;
screen.style.color = T.ink;

// ---------- Outils de dessin ----------
function el(parent, x, y, w, h, style) {
  const node = document.createElement("div");
  Object.assign(node.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" }, style || {});
  parent.appendChild(node);
  return node;
}
function text(parent, x, y, content, style) {
  const node = el(parent, x, y, 0, 0, Object.assign({ width: "auto", height: "auto" }, style));
  node.className = "t";
  node.textContent = content;
  return node;
}
function cut(size) {
  return `polygon(${size}px 0, 100% 0, 100% calc(100% - ${size}px), calc(100% - ${size}px) 100%, 0 100%, 0 ${size}px)`;
}
// Plaque à coins coupés : trait d'encre, remplissage, ombre en aplat décalé.
function plate(parent, x, y, w, h, o) {
  const c = o.cut === undefined ? T.cut : o.cut, lw = o.lw === undefined ? T.line : o.lw;
  if (o.shadow) el(parent, x + o.shadow, y + o.shadow, w, h, { background: T.ink, clipPath: cut(c) });
  const outer = el(parent, x, y, w, h, { background: o.line || T.ink, clipPath: cut(c), opacity: o.opacity || 1 });
  return el(outer, lw, lw, w - 2 * lw, h - 2 * lw, { background: o.fill, clipPath: cut(Math.max(0, c - lw * 0.6)) });
}
function ring(parent, x, y, w, h, color, double) {
  if (double) {
    plate(parent, x - 9, y - 9, w + 18, h + 18, { fill: "transparent", line: T.green, lw: 3, cut: T.cut + 4 });
    plate(parent, x - 4, y - 4, w + 8, h + 8, { fill: "transparent", line: T.green, lw: 3, cut: T.cut + 2 });
  } else {
    plate(parent, x - 5, y - 5, w + 10, h + 10, { fill: "transparent", line: color, lw: 4, cut: T.cut + 2 });
  }
}
function svg(parent, x, y, w, h, body, viewBox, style) {
  const node = el(parent, x, y, w, h, style);
  node.innerHTML = `<svg width="${w}" height="${h}" viewBox="${viewBox || "0 0 24 24"}" preserveAspectRatio="xMidYMid meet">${body}</svg>`;
  return node;
}
const dots = (color, step) => `radial-gradient(${color} 22%, transparent 24%) 0 0 / ${step}px ${step}px`;
const hatch = (a, b) => `repeating-linear-gradient(135deg, ${a} 0 3px, ${b} 3px 5px)`;

// ---------- Icônes (grille 24, une couleur) ----------
const ICONS = {
  unit: '<circle cx="12" cy="7" r="4"/><path d="M4 22v-4c0-3 3-5 8-5s8 2 8 5v4z"/>',
  building: '<path d="M3 22V9l3-2v3l3-2v3l3-2v3l3-2v3l3-2v3l3-2v13z"/>',
  spell: '<path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/>',
  gear: '<path d="M18 2h4v4L10 18l-4-4zM3 15l6 6-2 2-2-2-2 2-2-2 2-2-2-2z"/>',
  hero: '<path d="M2 7l5 4 5-7 5 7 5-4-2 13H4z"/>',
  essence: '<path d="M12 1C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-14z"/>',
};
function icon(parent, x, y, size, kind, color) {
  return svg(parent, x, y, size, size, `<g fill="${color}">${ICONS[kind]}</g>`);
}

// ---------- Illustrations factices ----------
// Figure d'encre sur fond teinté tramé : remplace l'illustration IA (bible : même trait, même papier).
const FIGURES = {
  unit: s => `<rect x="${34 - s}" y="44" width="${32 + 2 * s}" height="50" fill="${T.paper}" stroke="${T.ink}" stroke-width="4"/>
    <rect x="34" y="14" width="32" height="32" fill="${T.paper}" stroke="${T.ink}" stroke-width="4"/>
    <rect x="34" y="24" width="32" height="8" fill="${T.ink}"/><circle cx="43" cy="28" r="2.5" fill="${T.paper}"/><circle cx="57" cy="28" r="2.5" fill="${T.paper}"/>`,
  building: () => `<path d="M24 94V38h10v8h10v-8h12v8h10v-8h10v56z" fill="${T.paper}" stroke="${T.ink}" stroke-width="4"/>
    <path d="M42 94V70a8 8 0 0 1 16 0v24z" fill="${T.ink}"/>`,
  spell: () => `<path d="M50 8l9 28 29 6-25 14 6 30-19-20-19 20 6-30-25-14 29-6z" fill="${T.paper}" stroke="${T.ink}" stroke-width="4"/>`,
  gear: () => `<path d="M70 10h18v18L44 72l-16-16z" fill="${T.paper}" stroke="${T.ink}" stroke-width="4"/>
    <path d="M18 62l20 20-8 8-6-6-8 8-8-8 8-8-6-6z" fill="${T.ink}"/>`,
  hero: () => `<path d="M30 94l6-46h28l6 46z" fill="${T.paper}" stroke="${T.ink}" stroke-width="4"/>
    <circle cx="50" cy="32" r="16" fill="${T.paper}" stroke="${T.ink}" stroke-width="4"/>
    <path d="M34 18l6 6 10-12 10 12 6-6v-4H34z" fill="${T.essence}" stroke="${T.ink}" stroke-width="3"/>
    <rect x="42" y="30" width="16" height="4" fill="${T.ink}"/>`,
};
function art(parent, x, y, w, h, card, asleep) {
  const box = el(parent, x, y, w, h, { background: `${dots(T.artDot, 6)}, ${card.hue || T.type[card.type]}`,
    overflow: "hidden", filter: asleep ? "grayscale(1) contrast(.8)" : "none", opacity: asleep ? 0.7 : 1 });
  svg(box, 0, 0, w, h, FIGURES[card.type](card.force ? card.force * 2 : 4), "0 0 100 100");
  return box;
}

// ---------- Pastilles (0033, 0034) ----------
function costDrop(parent, x, y, size, value) {
  svg(parent, x, y, size, size, `<path d="M12 1C9 7 4.5 11 4.5 15a7.5 7.5 0 0 0 15 0C19.5 11 15 7 12 1z" fill="${T.essence}" stroke="${T.ink}" stroke-width="1.6"/>`);
  text(parent, x, y + size * 0.3, value, { width: size + "px", textAlign: "center", font: `800 ${size * 0.5}px ${T.fontTitle}`, color: T.ink });
}
function forceDiamond(parent, x, y, size, value, color) {
  svg(parent, x, y, size, size, `<path d="M12 1l11 11-11 11L1 12z" fill="${T.paper}" stroke="${T.ink}" stroke-width="1.8"/>`);
  text(parent, x, y + size * 0.22, value, { width: size + "px", textAlign: "center", font: `800 ${size * 0.52}px ${T.fontTitle}`, color: color || T.ink });
}
function heart(parent, x, y, size, value) {
  svg(parent, x, y, size, size, `<path d="M12 22L2.5 12.5A5.5 5.5 0 0 1 12 5a5.5 5.5 0 0 1 9.5 7.5z" fill="${T.heart}" stroke="${T.ink}" stroke-width="1.6"/>`);
  text(parent, x, y + size * 0.22, value, { width: size + "px", textAlign: "center", font: `800 ${size * 0.42}px ${T.fontTitle}`, color: T.paper });
}
function keyword(parent, x, y, label, size) {
  const tag = text(parent, x, y, label, { font: `800 ${size}px ${T.fontTitle}`, letterSpacing: ".08em",
    textTransform: "uppercase", background: T.ink, color: T.paper, padding: "1px 4px" });
  return tag;
}

// ---------- Carte 158×220 (0027) ----------
const LABELS = { unit: "Unit", building: "Building", spell: "Spell", gear: "Gear", hero: "Hero" };
function card(parent, x, y, c, scale) {
  const holder = el(parent, x, y, 158, 220, { transform: `scale(${scale || 1})`, transformOrigin: "0 0" });
  const tint = T.type[c.type];
  const face = plate(holder, 0, 0, 158, 220, { fill: T.band === "hatch" ? hatch(tint, T.tintShade) : tint, shadow: T.shadow / 2 });
  const panel = plate(face, 4, 4, 146, 208, { fill: T.paper, lw: 1.5, cut: T.cut - 3 });
  costDrop(panel, 3, 3, 28, c.cost);
  text(panel, 33, 9, c.name, { font: `800 13px ${T.fontTitle}`, letterSpacing: ".02em", color: T.ink });
  if (c.force) forceDiamond(panel, 115, 3, 26, c.force);
  if (c.health) heart(panel, 115, 3, 26, c.health);
  art(panel, 3, 34, 137, 70, c);
  el(panel, 3, 34, 137, 70, { boxShadow: `inset 0 0 0 2px ${T.ink}` });
  const band = el(panel, 3, 107, 137, 17, { background: tint, boxShadow: `inset 0 0 0 1.5px ${T.ink}` });
  icon(band, 4, 2, 13, c.type, T.ink);
  text(band, 20, 2, LABELS[c.type] + (c.token ? " · Jeton" : ""), { font: `800 9px ${T.fontTitle}`, letterSpacing: ".12em", textTransform: "uppercase", color: T.ink });
  if (c.speed) text(band, 0, 2, c.speed, { right: "5px", left: "auto", font: `700 9px ${T.fontTitle}`, letterSpacing: ".08em", textTransform: "uppercase", color: T.ink });
  const body = el(panel, 5, 128, 133, 74, { font: `400 10.5px/1.3 ${T.fontText}`, color: T.ink, whiteSpace: "normal" });
  if (c.keyword) {
    const k = document.createElement("span");
    Object.assign(k.style, { font: `800 8.5px ${T.fontTitle}`, letterSpacing: ".1em", textTransform: "uppercase",
      background: T.ink, color: T.paper, padding: "1px 4px", marginRight: "4px" });
    k.textContent = c.keyword;
    body.appendChild(k);
  }
  body.appendChild(document.createTextNode(c.text || ""));
  return holder;
}
function back(parent, x, y, w, h, player) {
  const face = plate(parent, x, y, w, h, { fill: T.backFill, line: T.ink, shadow: w > 100 ? T.shadow / 2 : 0, cut: w > 100 ? T.cut : 4 });
  el(face, 0, 0, w, h, { background: `repeating-linear-gradient(45deg, ${T.backLine} 0 1.5px, transparent 1.5px 12px), repeating-linear-gradient(-45deg, ${T.backLine} 0 1.5px, transparent 1.5px 12px)` });
  el(face, 0, 0, w, h, { boxShadow: `inset 0 0 0 ${w > 100 ? 4 : 2}px ${player === "a" ? T.a : T.b}` });
  const s = Math.min(w, h) * 0.42;
  const emblem = plate(face, (w - 6) / 2 - s / 2, (h - 6) / 2 - s / 2, s, s, { fill: T.paper, lw: 1.5, cut: s / 6 });
  for (let i = 0; i < 25; i++) el(emblem, 2 + (i % 5) * (s - 7) / 5, 2 + Math.floor(i / 5) * (s - 7) / 5, (s - 7) / 5 - 1, (s - 7) / 5 - 1, { background: i === 12 ? T.essence : T.ink, opacity: i === 12 ? 1 : 0.8 });
}

// ---------- Pièce 125×125 (mini-carte, 0027) ----------
function piece(parent, x, y, c, player, o) {
  o = o || {};
  if (o.ring === "yellow") ring(parent, x, y, 125, 125, T.yellow);
  if (o.ring === "green") ring(parent, x, y, 125, 125, T.green, true);
  const tint = T.type[c.type];
  const face = plate(parent, x, y, 125, 125, { fill: player === "a" ? T.a : T.b, lw: 2, shadow: T.shadow / 2 });
  const panel = plate(face, 4, 4, 113, 113, { fill: T.paper, lw: 1.5, cut: T.cut - 3 });
  text(panel, 4, 4, c.name, { font: `800 12px ${T.fontTitle}`, color: T.ink, letterSpacing: ".02em" });
  if (c.force) forceDiamond(panel, 82, 1, 26, c.force, o.forceColor);
  if (c.health) heart(panel, 82, 1, 26, c.health);
  art(panel, 2, 26, 107, 64, c, o.asleep);
  el(panel, 2, 26, 107, 64, { boxShadow: `inset 0 0 0 1.5px ${T.ink}` });
  const band = el(panel, 2, 92, 107, 17, { background: tint, boxShadow: `inset 0 0 0 1.5px ${T.ink}` });
  icon(band, 3, 2, 13, c.type, T.ink);
  if (c.keyword) keyword(band, 19, 3, c.keyword, 8);
  else text(band, 19, 3, LABELS[c.type], { font: `800 8px ${T.fontTitle}`, letterSpacing: ".12em", textTransform: "uppercase", color: T.ink });
  if (o.asleep) text(panel, 0, 46, "endormie", { width: "109px", textAlign: "center", font: `800 9px ${T.fontTitle}`, letterSpacing: ".14em", textTransform: "uppercase", color: T.paper, textShadow: `0 0 3px ${T.ink}, 0 0 2px ${T.ink}` });
}

// ---------- Cartes du deck de test ----------
const C = {
  capitaine: { name: "Capitaine", type: "hero", cost: 0, health: 15, hue: T.heroHue },
  recrue: { name: "Recrue", type: "unit", cost: 1, force: 2 },
  soldat: { name: "Soldat", type: "unit", cost: 2, force: 3 },
  colosse: { name: "Colosse", type: "unit", cost: 5, force: 6, text: "" },
  pillard: { name: "Pillard", type: "unit", cost: 2, force: 2, keyword: "Assaut 1", text: "" },
  gardien: { name: "Gardien", type: "unit", cost: 2, force: 2, keyword: "Rempart 1", text: "" },
  heraut: { name: "Héraut", type: "unit", cost: 3, force: 3, keyword: "Arrivée", text: "Une Unit ennemie ciblée a −1 Force jusqu'à la fin du tour." },
  martyr: { name: "Martyr", type: "unit", cost: 3, force: 3, keyword: "Dernier souffle", text: "Une Unit alliée ciblée a +1 Force tant que la pièce est en jeu." },
  palissade: { name: "Palissade", type: "building", cost: 2, force: 4 },
  campement: { name: "Campement", type: "building", cost: 3, force: 4, keyword: "Avant-poste", text: "" },
  renfort: { name: "Renfort", type: "spell", cost: 1, speed: "Réaction", text: "Une Unit alliée ciblée a +2 Force jusqu'à la fin du tour." },
  frappe: { name: "Frappe", type: "spell", cost: 3, speed: "Action", text: "Détruisez une Unit ennemie ciblée de Force 3 ou moins." },
  lame: { name: "Lame", type: "gear", cost: 1, text: "La Unit qui porte ce Gear a +1 Force." },
};

// ---------- Couche 0 : fond ----------
el(screen, 0, 0, 1920, 1080, { background: T.light });
// Décor de la place libre (Q9 de la fiche) : emblème du tournoi, très discret.
const deco = el(screen, 1578, 264, 326, 552, { opacity: T.decoOpacity });
for (let i = 0; i < 25; i++) el(deco, 38 + (i % 5) * 52, 150 + Math.floor(i / 5) * 52, 46, 46, { background: i === 12 ? T.essence : T.decoInk, clipPath: cut(8) });

// ---------- Couche 1 : jeu ----------
// E12 main adverse
for (let i = 0; i < 5; i++) back(screen, 993 - 141 + i * 58, 16, 50, 70, "b");

// E13 à E15 Sources
function sources(gridY, chipY, counts, essence, player) {
  const states = [];
  [["up", counts[0]], ["tilted", counts[1]], ["reserve", counts[2]], ["fonte", counts[3]]]
    .forEach(([s, n]) => { for (let i = 0; i < n; i++) states.push(s); });
  states.forEach((s, i) => {
    const x = 16 + (i % 5) * 80, y = gridY + Math.floor(i / 5) * 114;
    if (s === "up" || s === "tilted") {
      const f = plate(screen, x, y, 74, 106, { fill: s === "up" ? T.paper : T.paperDark, shadow: s === "up" ? T.shadow / 2 : 0, opacity: s === "up" ? 1 : 0.55 });
      el(f, 0, 0, 74, 106, { boxShadow: `inset 0 0 0 3px ${player === "a" ? T.a : T.b}`, opacity: 0.9 });
      icon(f, 20, 34, 30, "essence", s === "up" ? T.essence : T.muted);
      if (s === "up") svg(f, 20, 34, 30, 30, `<path d="${"M12 1C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-14z"}" fill="none" stroke="${T.ink}" stroke-width="1.5"/>`);
    } else {
      const hole = el(screen, x, y, 74, 106, { background: T.hole, clipPath: cut(T.cut), boxShadow: `inset 3px 3px 0 ${T.holeShadow}`, opacity: s === "fonte" ? 0.55 : 1 });
      if (s === "fonte") svg(hole, 0, 0, 74, 106, `<path d="M14 14L60 92M60 14L14 92" stroke="${T.ink}" stroke-width="4"/>`, "0 0 74 106");
    }
  });

}

// ---------- Échelle ----------
const frame = document.getElementById("frame");
function fit() {
  const choice = document.getElementById("scale").value;
  const available = Math.max(320, frame.parentElement.clientWidth - 32);
  const scale = choice === "fit" ? Math.min(1, available / 1920) : Number(choice);
  screen.style.transform = "scale(" + scale + ")";
  frame.style.width = 1920 * scale + "px";
  frame.style.height = 1080 * scale + "px";
}
document.getElementById("scale").addEventListener("change", fit);
document.getElementById("prev").addEventListener("change", e => { info.style.display = e.target.checked ? "" : "none"; });
window.addEventListener("resize", fit);
fit();
